[project]
name = "mozillion-hass"
version = "0.6.0"
description = "Mozillion Home Assistant integration"
readme = "README.md"
requires-python = ">=3.14.2"
dependencies = ["pyotp==2.9.0"]
authors = [
    { name = "KRoperUK", url = "https://github.com/KRoperUK" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
]
urls.Repository = "https://github.com/KRoperUK/mozillion-hass"
urls.Documentation = "https://github.com/KRoperUK/mozillion-hass"
urls."Issue Tracker" = "https://github.com/KRoperUK/mozillion-hass/issues"

[dependency-groups]
dev = [
    "homeassistant==2026.7.1",
    "pytest==9.0.3",
    "pytest-homeassistant-custom-component>=0.13.341",
    "pytest-asyncio>=1.3.0",
    "pytest-aiohttp>=1.1.0",
    "pytest-cov==7.1.0",
    "pytest-timeout==2.4.0",
    "pytest-unordered>=0.7.0",
    "pytest-freezer",
    "pytest-picked",
    "pytest-socket>=0.7.0",
    "pytest-sugar==1.0.0",
    "syrupy>=5.3.0",
    "requests-mock==1.12.1",
    "respx==0.23.1",
    "python-dotenv",
    "ruff==0.14.13",
    "mypy==2.1.0",
]

[tool.pytest.ini_options]
# pytest-homeassistant-custom-component ships an autouse *async* fixture
# (`enable_event_loop_debug`). Under pytest 9 / strict mode that fixture is no
# longer claimed by pytest-asyncio and every test errors out, so we run in
# "auto" mode which lets pytest-asyncio handle async fixtures transparently.
asyncio_mode = "auto"
testpaths = ["tests"]
norecursedirs = ["tests/test_live.py"]
addopts = [
    "--strict-markers",
    "--timeout=30",
    "-p",
    "no:cacheprovider",
]
filterwarnings = [
    "error",
    # pytest-asyncio still warns (not errors) about the async autouse fixture;
    # it works correctly under auto mode, so don't fail the build on it.
    "ignore::pytest.PytestDeprecationWarning",
    # pytest-asyncio / AsyncMock finalization artifact under Python 3.14: a
    # coroutine created by an AsyncMock is GC'd after the test, which is benign.
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.run]
branch = true
source = ["custom_components/mozillion"]
omit = ["tests/*", "custom_components/mozillion/__pycache__/*", "custom_components/mozillion/__init__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 69
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "def __repr__",
]

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["custom_components", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = [
    "B008", # function call in argument defaults (Home Assistant selectors)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "SIM", "RUF003", "RUF059"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
check_untyped_defs = true
show_error_codes = true
files = ["custom_components/mozillion"]

[[tool.mypy.overrides]]
module = "homeassistant.*"
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "pyotp.*"
ignore_missing_imports = true
follow_imports = "skip"

# HA types are unavailable at strict-mode check time (homeassistant is not
# installed as a runtime dependency — it's only a test dependency). The
# subclass, return-type, and override errors are all artefacts of HA types
# being Any, so disable the checks that strict mode enables but can't satisfy.
# The effective policy is: be strict about our own code, not about HA types.
[[tool.mypy.overrides]]
module = "custom_components.*"
disallow_subclassing_any = false
allow_untyped_defs = false
warn_unused_ignores = true
warn_return_any = true
