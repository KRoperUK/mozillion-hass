[project]
name = "mozillion-hass"
version = "0.5.1"
description = "Mozillion Home Assistant integration"
readme = "README.md"
requires-python = ">=3.14.2"
dependencies = ["pyotp==2.9.0"]

[dependency-groups]
dev = [
    "homeassistant==2026.7.1",
    "pytest==9.0.3",
    "pytest-homeassistant-custom-component>=0.13.341",
    "pytest-asyncio>=1.3.0",
    "pytest-aiohttp>=1.1.0",
    "pytest-cov==7.1.0",
    "pytest-timeout==2.4.0",
    "pytest-unordered>=0.7.0",
    "pytest-freezer",
    "pytest-picked",
    "pytest-socket>=0.7.0",
    "pytest-sugar==1.0.0",
    "syrupy>=5.3.0",
    "requests-mock==1.12.1",
    "respx==0.23.1",
    "python-dotenv",
    "ruff==0.14.13",
    "mypy==2.1.0",
]

[tool.pytest.ini_options]
# pytest-homeassistant-custom-component ships an autouse *async* fixture
# (`enable_event_loop_debug`). Under pytest 9 / strict mode that fixture is no
# longer claimed by pytest-asyncio and every test errors out, so we run in
# "auto" mode which lets pytest-asyncio handle async fixtures transparently.
asyncio_mode = "auto"
testpaths = ["tests"]
norecursedirs = ["tests/test_live.py"]
addopts = [
    "--strict-markers",
    "--timeout=30",
    "-p",
    "no:cacheprovider",
]
filterwarnings = [
    "error",
    # pytest-asyncio still warns (not errors) about the async autouse fixture;
    # it works correctly under auto mode, so don't fail the build on it.
    "ignore::pytest.PytestDeprecationWarning",
    # pytest-asyncio / AsyncMock finalization artifact under Python 3.14: a
    # coroutine created by an AsyncMock is GC'd after the test, which is benign.
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.run]
branch = true
source = ["custom_components/mozillion"]
omit = ["tests/*", "custom_components/mozillion/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "def __repr__",
]

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["custom_components", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = [
    "B008", # function call in argument defaults (Home Assistant selectors)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "SIM", "RUF003", "RUF059"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
warn_unused_ignores = false
warn_redundant_casts = true
disallow_untyped_defs = false
check_untyped_defs = true
show_error_codes = true
exclude = ["tests/", ".venv/", "build/"]

[[tool.mypy.overrides]]
module = ["homeassistant.*", "pyotp.*"]
ignore_missing_imports = true
follow_imports = "skip"
