repos:
  # General file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: debug-statements
      - id: detect-private-key

  # Ruff linting + formatting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.13
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Lint the workflow files themselves. CI runs ruff directly rather than
  # pre-commit, so ci.yml carries a matching actionlint step -- the two must stay
  # in step, or a workflow defect blocks locally while passing in CI.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  # Keep manifest.json keys in the order hassfest expects (domain/name first,
  # then alphabetical) so CI's hassfest validation never trips on ordering.
  - repo: local
    hooks:
      - id: sort-manifest
        name: sort manifest.json
        entry: python scripts/sort_manifest.py
        language: system
        files: ^custom_components/mozillion/manifest\.json$
        pass_filenames: false

  # Commit message convention
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.0.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, refactor, docs, test, chore, style, ci, perf, build]
