name: CI

# Lint/format/test/HACS validation for the Mozillion integration.
#
# Modeled on the patterns used in KRoperUK/sungrow-hass:
#   * minimal read-only permissions + job-level cancellation
#   * a `changes` gate (dorny/paths-filter) so docs/README-only PRs skip the
#     heavy compute jobs without making the required checks go red
#   * pinned third-party actions (commit SHAs) for supply-chain safety
#   * a real test job: mypy type-check + pytest with branch coverage and a
#     JUnit report, plus a best-effort Codecov upload
#   * HACS + hassfest validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect whether the change touches the integration itself. Non-impacting
  # changes (docs, README, other workflows, etc.) skip the heavy jobs below —
  # and because a job skipped via `if` reports "success", the PR stays mergeable
  # while wasting no compute.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      component: ${{ steps.filter.outputs.component }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            component:
              - 'custom_components/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'hacs.json'
              - '.github/workflows/ci.yml'
              - 'scripts/compute-dev-tag.sh'

  lint:
    needs: changes
    if: needs.changes.outputs.component == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Set up Python
        run: uv python install 3.14

      - name: Create virtualenv
        run: uv venv --python 3.14 .venv

      - name: Install ruff
        # Pin to the same ruff as pyproject.toml so lint
        # and format can't drift between the two jobs.
        run: uv pip install --python .venv "ruff==0.14.13"

      - name: Lint with ruff
        # --output-format=github emits ::error annotations inline on the
        # offending lines in the PR "Files changed" view.
        run: source .venv/bin/activate && ruff check --output-format=github custom_components/ tests/

      - name: Check formatting
        run: source .venv/bin/activate && ruff format --check custom_components/ tests/

  test:
    needs: changes
    if: needs.changes.outputs.component == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Set up Python
        run: uv python install 3.14

      - name: Create virtualenv
        run: uv venv --python 3.14 .venv

      - name: Install dependencies
        run: uv sync --dev

      - name: Type check with mypy
        # Convert mypy output into GitHub annotations (inline on the PR diff)
        # while preserving its exit status via pipefail, so type errors surface
        # on the offending line instead of only in the raw log.
        run: |
          set -o pipefail
          source .venv/bin/activate
          mypy custom_components/mozillion | sed -E \
            -e 's/^([^:]+):([0-9]+): error: (.*)$/::error file=\1,line=\2::\3/' \
            -e 's/^([^:]+):([0-9]+): note: (.*)$/::notice file=\1,line=\2::\3/'

      - name: Run tests with coverage
        run: >-
          source .venv/bin/activate && pytest tests/
          --ignore=tests/test_live.py
          --cov=custom_components/mozillion --cov-branch
          --cov-report=xml --cov-report=term-missing
          --junitxml=junit.xml -o junit_family=legacy
          -v

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage.xml

      - name: Upload coverage to Codecov
        # Best-effort: only runs when a token is configured, and never fails CI.
        if: ${{ !cancelled() && env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: coverage.xml
          fail_ci_if_error: false

      - name: Upload test results to Codecov
        if: ${{ !cancelled() && env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          report_type: test_results
          files: junit.xml

  hacs_validate:
    needs: changes
    if: needs.changes.outputs.component == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: HACS validation
        uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        with:
          category: integration

      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@f4ca6f671bd429efb108c0f2fa0ae8af0215986c # master

  # Branch dev builds — a same-repo PR that changed the component, once CI is green.
  # Fork PRs get a read-only token (release would fail) and this job holds
  # contents: write, so keep it to same-repo. Never for the release-please PR branch.
  dev-release:
    needs: [changes, lint, test, hacs_validate]
    if: >-
      needs.changes.outputs.component == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Compute next version
        id: nextver
        uses: TriPSs/conventional-changelog-action@952b14bbc4be87e8458a6ac5926fc655608b1b19 # v6
        with:
          github-token: ${{ github.token }}
          version-file: custom_components/mozillion/manifest.json
          version-path: version
          tag-prefix: v
          preset: conventionalcommits
          skip-on-empty: true
          skip-version-file: true
          skip-commit: true
          skip-tag: true
          skip-git-pull: true
          git-push: false
          output-file: false

      - name: Compute dev tag
        id: tag
        env:
          SKIPPED: ${{ steps.nextver.outputs.skipped }}
          NEXT_VERSION: ${{ steps.nextver.outputs.version }}
          HEAD_BRANCH: ${{ github.head_ref }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ "$SKIPPED" = "true" ] || [ -z "$NEXT_VERSION" ]; then
            VERSION=$(jq -r .version custom_components/mozillion/manifest.json)
          else
            VERSION="$NEXT_VERSION"
          fi
          WORKFLOW_EVENT=pull_request
          export VERSION HEAD_BRANCH RUN_ID WORKFLOW_EVENT
          TAG=$(bash scripts/compute-dev-tag.sh)
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Create pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          BRANCH_RAW: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh release create "$TAG" \
            --prerelease \
            --title "$TAG" \
            --notes "Development build from branch \`${BRANCH_RAW}\` (PR #${PR_NUMBER}) at commit \`${COMMIT_SHA}\`." \
            || echo "Release already exists for this tag, skipping."

  # Main release-candidate dev builds — a push to main that changed the component,
  # once CI is green. Never for the "chore(main): release X.Y.Z" commit (matched via
  # ": release ") which release-please lands when its PR merges.
  dev-release-main:
    needs: [changes, lint, test, hacs_validate]
    if: >-
      needs.changes.outputs.component == 'true' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      !contains(github.event.head_commit.message, ': release ')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Compute next version
        id: nextver
        uses: TriPSs/conventional-changelog-action@952b14bbc4be87e8458a6ac5926fc655608b1b19 # v6
        with:
          github-token: ${{ github.token }}
          version-file: custom_components/mozillion/manifest.json
          version-path: version
          tag-prefix: v
          preset: conventionalcommits
          skip-on-empty: true
          skip-version-file: true
          skip-commit: true
          skip-tag: true
          skip-git-pull: true
          git-push: false
          output-file: false

      - name: Compute dev tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          SKIPPED: ${{ steps.nextver.outputs.skipped }}
          NEXT_VERSION: ${{ steps.nextver.outputs.version }}
        run: |
          if [ "$SKIPPED" = "true" ] || [ -z "$NEXT_VERSION" ]; then
            VERSION=$(jq -r .version custom_components/mozillion/manifest.json)
          else
            VERSION="$NEXT_VERSION"
          fi
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Full release v${VERSION} exists; deleting matching RC pre-releases."
            gh release list --limit 1000 --json tagName --jq '.[].tagName' \
            | { grep -E "^dev-v${VERSION}-rc\.?[0-9]+$" || true; } \
            | while read -r tag; do
                echo "Deleting stale RC pre-release: ${tag}"
                gh release delete "$tag" --yes --cleanup-tag
              done
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          highest_rc=$(gh release list --limit 1000 --json tagName --jq '.[].tagName' \
            | grep -E "^dev-v${VERSION}-rc\.[0-9]+$" | sed -E 's/^.*-rc\.//' | sort -n | tail -1 || true)
          RC_NUMBER=$(( ${highest_rc:-0} + 1 ))
          HEAD_BRANCH=main
          WORKFLOW_EVENT=push
          export VERSION RC_NUMBER HEAD_BRANCH WORKFLOW_EVENT
          TAG=$(bash scripts/compute-dev-tag.sh)
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Prune superseded main RC pre-releases
        if: ${{ steps.tag.outputs.skip != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          gh release list --limit 1000 --json tagName --jq '.[].tagName' \
          | { grep -E '^dev-v[0-9]+\.[0-9]+\.[0-9]+-rc\.?[0-9]+$' || true; } \
          | while read -r tag; do
              tag_version="${tag#dev-v}"
              tag_version="${tag_version%-rc*}"
              if [ "$tag_version" != "$VERSION" ]; then
                echo "Deleting superseded RC pre-release: ${tag} (version ${tag_version} != ${VERSION})"
                gh release delete "$tag" --yes --cleanup-tag
              fi
            done

      - name: Create pre-release
        if: ${{ steps.tag.outputs.skip != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
          COMMIT_SHA: ${{ github.sha }}
          CHANGELOG: ${{ steps.nextver.outputs.clean_changelog }}
        run: |
          latest_stable=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name' 2>/dev/null || true)
          if [ -n "$latest_stable" ]; then
            stable_line="For everyday use, install the latest **stable** release instead: [\`${latest_stable}\`](https://github.com/${GITHUB_REPOSITORY}/releases/tag/${latest_stable})."
          else
            stable_line="No stable release has been published yet."
          fi
          {
            echo "> [!WARNING]"
            echo "> **This is an automated release-candidate build, not an official release.**"
            echo "> It previews the upcoming **v${VERSION}** release from \`main\` (commit \`${COMMIT_SHA}\`) and may be unstable."
            echo "> ${stable_line}"
            echo ""
            echo "## What's changed for v${VERSION}"
            echo ""
            if [ -n "${CHANGELOG}" ]; then
              printf '%s\n' "${CHANGELOG}"
            else
              echo "_No user-facing changes detected since the last release._"
            fi
          } > rc-notes.md
          gh release create "$TAG" \
            --prerelease \
            --title "$TAG" \
            --notes-file rc-notes.md \
            || echo "Release already exists for this tag, skipping."
