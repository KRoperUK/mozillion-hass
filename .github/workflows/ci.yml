name: CI

# Lint/format/test/HACS validation for the Mozillion integration.
#
# Modeled on the patterns used in KRoperUK/sungrow-hass:
#   * minimal read-only permissions + job-level cancellation
#   * a `changes` gate (dorny/paths-filter) so docs/README-only PRs skip the
#     heavy compute jobs without making the required checks go red
#   * pinned third-party actions (commit SHAs) for supply-chain safety
#   * a real test job: mypy type-check + pytest with branch coverage and a
#     JUnit report, plus a best-effort Codecov upload
#   * HACS + hassfest validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect whether the change touches the integration itself. Non-impacting
  # changes (docs, README, other workflows, etc.) skip the heavy jobs below —
  # and because a job skipped via `if` reports "success", the PR stays mergeable
  # while wasting no compute.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      component: ${{ steps.filter.outputs.component }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            component:
              - 'custom_components/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'dev.requirements.txt'
              - 'dev.requirements.in'
              - 'hacs.json'
              - '.github/workflows/ci.yml'

  lint:
    needs: changes
    if: needs.changes.outputs.component == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: dev.requirements.txt

      - name: Install ruff
        # Pin to the same ruff as the test env (dev.requirements.txt) so lint
        # and format can't drift between the two jobs.
        run: pip install "$(grep -E '^ruff==' dev.requirements.txt)"

      - name: Lint with ruff
        # --output-format=github emits ::error annotations inline on the
        # offending lines in the PR "Files changed" view.
        run: ruff check --output-format=github custom_components/ tests/

      - name: Check formatting
        run: ruff format --check custom_components/ tests/

  test:
    needs: changes
    if: needs.changes.outputs.component == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          # Home Assistant 2026.6.0 (and its hass-nabucasa dep) require Python
          # >=3.14, so that is the only supported runtime for this integration.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: dev.requirements.txt

      - name: Install dependencies
        run: pip install -r dev.requirements.txt

      - name: Type check with mypy
        # Convert mypy output into GitHub annotations (inline on the PR diff)
        # while preserving its exit status via pipefail, so type errors surface
        # on the offending line instead of only in the raw log.
        run: |
          set -o pipefail
          mypy custom_components/mozillion | sed -E \
            -e 's/^([^:]+):([0-9]+): error: (.*)$/::error file=\1,line=\2::\3/' \
            -e 's/^([^:]+):([0-9]+): note: (.*)$/::notice file=\1,line=\2::\3/'

      - name: Run tests with coverage
        run: >-
          pytest tests/
          --ignore=tests/test_live.py
          --cov=custom_components/mozillion --cov-branch
          --cov-report=xml --cov-report=term-missing
          --junitxml=junit.xml -o junit_family=legacy
          -v

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage.xml

      - name: Upload coverage to Codecov
        # Best-effort: only runs when a token is configured, and never fails CI.
        if: ${{ !cancelled() && env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: coverage.xml
          fail_ci_if_error: false

      - name: Upload test results to Codecov
        if: ${{ !cancelled() && env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          report_type: test_results
          files: junit.xml

  hacs_validate:
    needs: changes
    if: needs.changes.outputs.component == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: HACS validation
        uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        with:
          category: integration

      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@f4ca6f671bd429efb108c0f2fa0ae8af0215986c # master
